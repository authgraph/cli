version: 2

project_name: authgraph

before:
  hooks:
    - go mod tidy

builds:
  - main: ./main.go
    binary: authgraph
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/authgraph/cli/cmd.version={{.Version}}

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

brews:
  - repository:
      owner: authgraph
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://authgraph.dev"
    description: "CLI for Authgraph permission engine"
    license: "MIT"
    install: |
      bin.install "authgraph"
    test: |
      system "#{bin}/authgraph", "version"

release:
  github:
    owner: authgraph
    name: cli
  prerelease: auto
